<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href"manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Chess with AI & Sound</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: #0ea5e9;
            --square-light: #f0d9b5;
            --square-dark: #b58863;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
            color: var(--accent-color);
        }

        #status {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .game-container {
            display: flex;
            flex-direction: row;
            background: var(--panel-bg);
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        #board {
            display: grid;
            /* Scaled fluidly to comfortably fit smaller and laptop viewports without overflow */
            grid-template-columns: repeat(8, clamp(35px, 6.5vw, 55px));
            grid-template-rows: repeat(8, clamp(35px, 6.5vw, 55px));
            border: 4px solid #334155;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            user-select: none;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            font-size: clamp(20px, 4.2vw, 36px);
        }

        .light { background-color: var(--square-light); }
        .dark { background-color: var(--square-dark); }

        .square.selected {
            background-color: #bbc92e !important;
        }

        .legal-dot {
            position: absolute;
            width: clamp(8px, 1.8vw, 18px);
            height: clamp(8px, 1.8vw, 18px);
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            width: 200px;
            gap: 14px;
        }

        .control-group {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .control-group h3 {
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: var(--text-color);
            border: 1px solid #334155;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        @media (max-width: 700px) {
            .game-container {
                flex-direction: column;
                padding: 12px;
                gap: 12px;
            }
            .sidebar {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <h1>Chess</h1>
    <div id="status">Player's turn</div>

    <div class="game-container">
        <div id="board"></div>

        <div class="sidebar">
            <div class="control-group">
                <h3>Game Mode</h3>
                <select id="gameMode">
                    <option value="ai_white">Vs AI (Playing as White)</option>
                    <option value="ai_black">Vs AI (Playing as Black)</option>
                    <option value="local">Two Players (Local)</option>
                </select>
            </div>
            
            <button id="resetBtn">New Game</button>
            <button id="undoBtn">Undo Move</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'cut') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.12);
                osc.frequency.setValueAtTime(659.25, now + 0.24);
                osc.frequency.setValueAtTime(880, now + 0.36);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now);
                osc.stop(now + 0.6);
            }
        }
    </script>

    <script>
        const pieceUnicode = {
            p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
            P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
        };

        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        let game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let gameMode = 'ai_white';

        $('#gameMode').on('change', function() {
            gameMode = $(this).val();
            resetGame();
        });

        function renderBoard() {
            const $board = $('#board');
            $board.empty();

            let boardState = game.board();
            let isBlackPerspective = (gameMode === 'ai_black');

            let startRow = isBlackPerspective ? 7 : 0;
            let endRow = isBlackPerspective ? -1 : 8;
            let rowStep = isBlackPerspective ? -1 : 1;

            let startCol = isBlackPerspective ? 7 : 0;
            let endCol = isBlackPerspective ? -1 : 8;
            let colStep = isBlackPerspective ? -1 : 1;

            for (let r = startRow; r !== endRow; r += rowStep) {
                for (let c = startCol; c !== endCol; c += colStep) {
                    let squareName = files[c] + (8 - r);
                    let isLight = (r + c) % 2 === 0;
                    let squareClass = 'square ' + (isLight ? 'light' : 'dark');

                    if (selectedSquare === squareName) {
                        squareClass += ' selected';
                    }

                    let $square = $('<div></div>').addClass(squareClass).attr('data-square', squareName);

                    let piece = boardState[r][c];
                    if (piece) {
                        let symbolKey = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
                        let span = $('<span></span>').text(pieceUnicode[symbolKey]).css({
                            color: piece.color === 'w' ? '#ffffff' : '#000000',
                            textShadow: piece.color === 'w' ? '0 1px 2px rgba(0,0,0,0.8)' : '0 1px 2px rgba(255,255,255,0.3)'
                        });
                        $square.append(span);
                    }

                    if (selectedSquare && legalMoves.some(m => m.to === squareName)) {
                        let $dot = $('<div></div>').addClass('legal-dot');
                        $square.append($dot);
                    }

                    $board.append($square);
                }
            }
        }

        function isUserTurn() {
            if (gameMode === 'local') return true;
            if (gameMode === 'ai_white' && game.turn() === 'w') return true;
            if (gameMode === 'ai_black' && game.turn() === 'b') return true;
            return false;
        }

        $('#board').on('click', '.square', function() {
            if (!isUserTurn()) return;

            let clickedSquare = $(this).attr('data-square');

            if (selectedSquare) {
                let match = legalMoves.find(m => m.to === clickedSquare);
                if (match) {
                    executeMove({
                        from: selectedSquare,
                        to: clickedSquare,
                        promotion: 'q'
                    });
                    return;
                }
            }

            let piece = game.get(clickedSquare);
            if (piece && piece.color === game.turn()) {
                selectedSquare = clickedSquare;
                legalMoves = game.moves({ square: clickedSquare, verbose: true });
            } else {
                selectedSquare = null;
                legalMoves = [];
            }
            renderBoard();
        });

        function executeMove(moveObj) {
            let targetPiece = game.get(moveObj.to);
            let moveResult = game.move(moveObj);

            if (moveResult) {
                if (targetPiece || moveResult.captured) {
                    playSound('cut');
                } else {
                    playSound('move');
                }

                selectedSquare = null;
                legalMoves = [];
                renderBoard();
                updateStatus();

                if (!game.game_over() && !isUserTurn()) {
                    setTimeout(makeAIMove, 300);
                }
            }
        }

        const pawnTable = [
            [0,  0,  0,  0,  0,  0,  0,  0],
            [50, 50, 50, 50, 50, 50, 50, 50],
            [10, 10, 20, 30, 30, 20, 10, 10],
            [ 5,  5, 10, 25, 25, 10,  5,  5],
            [ 0,  0,  0, 20, 20,  0,  0,  0],
            [ 5, -5,-10,  0,  0,-10, -5,  5],
            [ 5, 10, 10,-20,-20, 10, 10,  5],
            [ 0,  0,  0,  0,  0,  0,  0,  0]
        ];

        const knightTable = [
            [-50,-40,-30,-30,-30,-30,-40,-50],
            [-40,-20,  0,  0,  0,  0,-20,-40],
            [-30,  0, 10, 15, 15, 10,  0,-30],
            [-30,  5, 15, 20, 20, 15,  5,-30],
            [-30,  0, 15, 20, 20, 15,  0,-30],
            [-30,  5, 10, 15, 15, 10,  5,-30],
            [-40,-20,  0,  5,  5,  0,-20,-40],
            [-50,-40,-30,-30,-30,-30,-40,-50]
        ];

        const bishopTable = [
            [-20,-10,-10,-10,-10,-10,-10,-20],
            [-10,  0,  0,  0,  0,  0,  0,-10],
            [-10,  0,  5, 10, 10,  5,  0,-10],
            [-10,  5,  5, 10, 10,  5,  5,-10],
            [-10,  0, 10, 10, 10, 10,  0,-10],
            [-10, 10, 10, 10, 10, 10, 10,-10],
            [-10,  5,  0,  0,  0,  0,  5,-10],
            [-20,-10,-10,-10,-10,-10,-10,-20]
        ];

        const rookTable = [
            [ 0,  0,  0,  0,  0,  0,  0,  0],
            [ 5, 10, 10, 10, 10, 10, 10,  5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [-5,  0,  0,  0,  0,  0,  0, -5],
            [ 0,  0,  0,  5,  5,  0,  0,  0]
        ];

        const queenTable = [
            [-20,-10,-10, -5, -5,-10,-10,-20],
            [-10,  0,  0,  0,  0,  0,  0,-10],
            [-10,  0,  5,  5,  5,  5,  0,-10],
            [ -5,  0,  5,  5,  5,  5,  0, -5],
            [  0,  0,  5,  5,  5,  5,  0, -5],
            [-10,  5,  5,  5,  5,  5,  0,-10],
            [-10,  0,  5,  0,  0,  0,  0,-10],
            [-20,-10,-10, -5, -5,-10,-10,-20]
        ];

        const kingMidTable = [
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-30,-40,-40,-50,-50,-40,-40,-30],
            [-20,-30,-30,-40,-40,-30,-30,-20],
            [-10,-20,-20,-20,-20,-20,-20,-10],
            [ 20, 20,  0,  0,  0,  0, 20, 20],
            [ 20, 30, 10,  0,  0, 10, 30, 20]
        ];

        function getPieceValue(piece, r, c) {
            let baseValue = 0;
            let tableVal = 0;
            let actualRow = piece.color === 'w' ? (7 - r) : r;

            switch (piece.type) {
                case 'p': 
                    baseValue = 100; 
                    tableVal = pawnTable[actualRow][c]; 
                    break;
                case 'n': 
                    baseValue = 320; 
                    tableVal = knightTable[actualRow][c]; 
                    break;
                case 'b': 
                    baseValue = 330; 
                    tableVal = bishopTable[actualRow][c]; 
                    break;
                case 'r': 
                    baseValue = 500; 
                    tableVal = rookTable[actualRow][c]; 
                    break;
                case 'q': 
                    baseValue = 900; 
                    tableVal = queenTable[actualRow][c]; 
                    break;
                case 'k': 
                    baseValue = 20000; 
                    tableVal = kingMidTable[actualRow][c]; 
                    break;
            }

            let total = baseValue + tableVal;
            let aiColor = (gameMode === 'ai_white') ? 'b' : 'w';
            return piece.color === aiColor ? total : -total;
        }

        function evaluateBoard(board) {
            let totalEvaluation = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    let piece = board[r][c];
                    if (piece) {
                        totalEvaluation += getPieceValue(piece, r, c);
                    }
                }
            }
            return totalEvaluation;
        }

        function makeAIMove() {
            let moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let bestMove = null;
            let bestValue = -999999;
            
            moves.sort(() => Math.random() - 0.5);

            let searchDepth = 3;

            for (let i = 0; i < moves.length; i++) {
                let move = moves[i];
                game.move(move);
                let value = minimax(searchDepth - 1, false, -1000000, 1000000);
                game.undo();

                if (value > bestValue) {
                    bestValue = value;
                    bestMove = move;
                }
            }

            if (bestMove) {
                let targetPiece = game.get(bestMove.to);
                let moveResult = game.move(bestMove);
                if (targetPiece || moveResult.captured) {
                    playSound('cut');
                } else {
                    playSound('move');
                }
                renderBoard();
                updateStatus();
            }
        }

        function minimax(depth, isMaximizing, alpha, beta) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            let moves = game.moves({ verbose: true });

            if (isMaximizing) {
                let maxEval = -999999;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evaluation = minimax(depth - 1, false, alpha, beta);
                    game.undo();
                    maxEval = Math.max(maxEval, evaluation);
                    alpha = Math.max(alpha, evaluation);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = 999999;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evaluation = minimax(depth - 1, true, alpha, beta);
                    game.undo();
                    minEval = Math.min(minEval, evaluation);
                    beta = Math.min(beta, evaluation);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function updateStatus() {
            let status = '';

            if (game.in_checkmate()) {
                let winner;
                if (gameMode === 'local') {
                    winner = game.turn() === 'w' ? 'Player 2' : 'Player 1';
                } else if (gameMode === 'ai_white') {
                    winner = game.turn() === 'w' ? 'Computer' : 'Player';
                } else {
                    winner = game.turn() === 'w' ? 'Player' : 'Computer';
                }
                status = `${winner} wins by checkmate!`;
                playSound('win');
            } else if (game.in_stalemate()) {
                status = 'Stalemate';
            } else if (game.in_draw()) {
                status = 'Draw';
            } else {
                if (gameMode === 'local') {
                    status = game.turn() === 'w' ? "Player 1's turn" : "Player 2's turn";
                } else {
                    if (isUserTurn()) {
                        status = "Player's turn";
                    } else {
                        status = "Computer's turn";
                    }
                }
            }
            $('#status').text(status);
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            renderBoard();
            updateStatus();

            if (gameMode === 'ai_black') {
                setTimeout(makeAIMove, 300);
            }
        }

        $('#resetBtn').on('click', resetGame);

        $('#undoBtn').on('click', function() {
            if (gameMode.startsWith('ai')) {
                game.undo();
                game.undo();
            } else {
                game.undo();
            }
            selectedSquare = null;
            legalMoves = [];
            renderBoard();
            updateStatus();
        });

        resetGame();
    </script>
</body>
</html>
